<!DOCTYPE html>
<html>
<head>
    <title>Register Student</title>
</head>
<body>
    <h1>New Student Register</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        Roll No: <input type="text" name="roll_no" required><br><br>
        Name: <input type="text" name="name" required><br><br>
        Photo Upload: <input type="file" name="face_image" accept="image/*" required><br><br>
        <button type="submit">Save Student</button>
    </form>
    <br><br>
<a href="/video_feed/">
    <button style="background:green; color:white; padding:10px 20px; font-size:18px; border:none; border-radius:5px;">
        📷 START FACE ATTENDANCE
    </button>
 </a>
    
</body>
</html>
